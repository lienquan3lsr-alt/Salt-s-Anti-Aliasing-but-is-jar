name: Build Salt's Anti-Aliasing (JDK 25)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          repository: Salt-and-Fries/Salt-s-Anti-Aliasing
          ref: fabric-1.21.1-4

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Show Java version
        run: java --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build JAR
        run: chmod +x ./gradlew && ./gradlew --version && ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: Salt-Anti-Aliasing-1.21.1-JDK25
          path: build/libs/*.jar
          
